# Existing databases validate the exact two original files provided by the owner.
services:
  backend:
    volumes:
      - type: bind
        source: ${ZDM_PRIVATE_MIGRATIONS_DIR:?}/V5__set_builtin_super_admin.sql
        target: /workspace/backend/src/main/resources/db/migration/V5__set_builtin_super_admin.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ZDM_PRIVATE_MIGRATIONS_DIR:?}/V132__grant_builtin_super_admin_supply_chain_identity.sql
        target: /workspace/backend/src/main/resources/db/migration/V132__grant_builtin_super_admin_supply_chain_identity.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.private/backend-existing-target
        target: /workspace/backend/target
