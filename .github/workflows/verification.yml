name: V1.1 verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  verification:
    name: V1.1 quality gate
    runs-on: ubuntu-24.04
    env:
      TARGET: ${{ github.event.pull_request.base.sha || github.event.before }}
      PHASE: ${{ github.event_name == 'pull_request' && 'delivery' || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Select published rules and plan the checked-out combination
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$TARGET^{commit}"
          if git cat-file -e "$TARGET:dev/quality-entry.mjs" 2>/dev/null; then
            git show "$TARGET:dev/quality-entry.mjs" > "$RUNNER_TEMP/zdm-entry.mjs"
          else
            test "$TARGET" = 6323b344be7bf77683ef7a79985588e894139871
            git show 4fa0bf56ff4dcfe16d569a314d47a110a30d7b0e:tests/quality-contract.test.mjs > "$RUNNER_TEMP/zdm-reference.test.mjs"
            echo "c9fe13845d8ac5325a9424100d4006e10560090167d3e70969a38730874500e6  $RUNNER_TEMP/zdm-reference.test.mjs" | sha256sum --check
            cp dev/quality-entry.mjs "$RUNNER_TEMP/zdm-entry.mjs"
          fi
          node "$RUNNER_TEMP/zdm-entry.mjs" --authority "$TARGET" plan --base "$TARGET" > "$RUNNER_TEMP/zdm-plan.json"
          node -e 'const p=require(process.argv[1]); console.log("checks="+JSON.stringify(p.delivery)); console.error(p.risk,p.delivery.join(", "))' "$RUNNER_TEMP/zdm-plan.json" >> "$GITHUB_OUTPUT"
      - name: Install locked frontend dependencies
        if: contains(fromJSON(steps.plan.outputs.checks), 'build') || contains(fromJSON(steps.plan.outputs.checks), 'unit') || contains(fromJSON(steps.plan.outputs.checks), 'e2e') || contains(fromJSON(steps.plan.outputs.checks), 'selection')
        run: npm ci --no-audit --no-fund
      - name: Prepare the registered browser
        if: contains(fromJSON(steps.plan.outputs.checks), 'e2e') || contains(fromJSON(steps.plan.outputs.checks), 'selection')
        run: npx --no-install playwright install --with-deps chromium
      - name: Prepare isolated database test configuration
        if: contains(fromJSON(steps.plan.outputs.checks), 'backend')
        run: node dev/init-env.mjs 5394 8394
      - name: Check all applicable evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/zdm-entry.mjs" --authority "$TARGET" "$PHASE" --base "$TARGET" --export "$RUNNER_TEMP/zdm-evidence"
      - uses: actions/upload-artifact@v4
        if: always() && steps.plan.outcome == 'success'
        with:
          name: verification-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zdm-evidence
          if-no-files-found: warn
